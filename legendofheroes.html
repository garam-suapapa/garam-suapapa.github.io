<main id="content" class="artifact-page"><header class="artifact-head"><p class="case-kicker">WORKING DOCUMENTS</p><h1>영웅전설:<br>가가브트릴로지</h1><p>시스템 규칙과 밸런스 수치를 표·그래프로 검토한 작업 산출물입니다. 이미지를 누르면 원본 크기로 확인할 수 있습니다.</p></header><div class="artifact-stack">
<figure class="evidence"><a href="assets/영웅전설 가가브트릴로지/sys/image 5.png" target="_blank" rel="noopener"><img src="assets/영웅전설 가가브트릴로지/sys/image 5.png" width="1579" height="578" alt="구간별 수치 표와 장비 가격 그래프를 정리한 밸런스 문서"></a><figcaption><strong>수치 구간과 가격 곡선</strong>여러 구간의 수치 표와 장비 가격 그래프를 한 화면에 배치해 변화 폭을 비교한 문서입니다.</figcaption></figure>
<figure class="evidence"><a href="assets/영웅전설 가가브트릴로지/sys/이미지 2.png" target="_blank" rel="noopener"><img src="assets/영웅전설 가가브트릴로지/sys/이미지 2.png" width="1294" height="637" loading="lazy" alt="게임 데이터 표와 계산 항목을 정리한 시스템 문서"></a><figcaption><strong>시스템 데이터 구조</strong>항목별 입력값과 계산 결과를 표로 정리해 시스템 데이터가 어떻게 연결되는지 검토한 자료입니다.</figcaption></figure>
<figure class="evidence"><a href="assets/영웅전설 가가브트릴로지/sys/이미지 3.png" target="_blank" rel="noopener"><img src="assets/영웅전설 가가브트릴로지/sys/이미지 3.png" width="771" height="681" loading="lazy" alt="시스템 규칙과 화면 예시, 처리 흐름을 정리한 기획 문서"></a><figcaption><strong>규칙과 화면 흐름</strong>규칙 설명과 실제 화면 예시를 함께 배치해 구현 대상과 동작 흐름을 전달한 문서입니다.</figcaption></figure>
